<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HeyHi PALS Demo – FTU</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Lexend+Deca:wght@300;400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
/* Layout: co-branded app shell (concept bar + header) over one centred working column; screens swap in place. */
:root{
  --bg:#F4F7F9; --surface:#FFFFFF; --surface-2:#EDF2F5; --line:#DFE5EA;
  --ink:#22282E; --muted:#56616C; --brand:#0D719A; --on-brand:#FFFFFF; --brand-soft:#E2EFF5; --deep:#145876;
  --sun:#FCB017; --on-sun:#22282E; --sun-soft:#FFF4DB; --sun-ink:#7A5200;
  --good:#1C6B43; --good-soft:#E1F2E8; --warn:#8A5A00; --warn-soft:#FFF2D6; --bad:#B03A0C; --bad-soft:#FCE5DC;
  --inst:#3B2F6B; --on-inst:#FFFFFF; --inst-soft:#EEEAF7; --inst-ink:#3B2F6B;
  --bar:#22282E; --on-bar:#FFFFFF; --dot:#D7DFE5; --shadow:0 1px 2px rgba(20,40,60,.06),0 4px 16px rgba(20,40,60,.06);
  --f-display:'Quicksand',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --f-body:'Lexend Deca','Segoe UI',system-ui,sans-serif;
  --f-cjk:'Noto Sans KR','Noto Sans SC','Noto Sans JP','Apple SD Gothic Neo','PingFang SC','Hiragino Sans',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1418; --surface:#161F25; --surface-2:#1E2930; --line:#2A3740;
  --ink:#E5ECF0; --muted:#9DABB6; --brand:#4FB0D8; --on-brand:#06222D; --brand-soft:#123544; --deep:#8CCDE8;
  --sun:#FCB017; --on-sun:#1B1606; --sun-soft:#3A2D0E; --sun-ink:#FCD27A;
  --good:#73D6A0; --good-soft:#12301F; --warn:#F5C36A; --warn-soft:#38290C; --bad:#FF9E7A; --bad-soft:#3B1A0F;
  --inst:#4A3C85; --on-inst:#FFFFFF; --inst-soft:#2A2444; --inst-ink:#C7BCF0;
  --bar:#000000; --on-bar:#E5ECF0; --dot:#1F2A31; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#161F25; --surface-2:#1E2930; --line:#2A3740;
  --ink:#E5ECF0; --muted:#9DABB6; --brand:#4FB0D8; --on-brand:#06222D; --brand-soft:#123544; --deep:#8CCDE8;
  --sun:#FCB017; --on-sun:#1B1606; --sun-soft:#3A2D0E; --sun-ink:#FCD27A;
  --good:#73D6A0; --good-soft:#12301F; --warn:#F5C36A; --warn-soft:#38290C; --bad:#FF9E7A; --bad-soft:#3B1A0F;
  --inst:#4A3C85; --on-inst:#FFFFFF; --inst-soft:#2A2444; --inst-ink:#C7BCF0;
  --bar:#000000; --on-bar:#E5ECF0; --dot:#1F2A31; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
svg:not([width]){width:18px;height:18px;flex:none}
.pill svg{width:14px;height:14px}
.upload svg{width:28px;height:28px}
#app{overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.cjk{font-family:var(--f-cjk)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.tab-nums{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* concept bar + header */
.concept{background:var(--bar);color:var(--on-bar);font-size:12.5px}
.concept .wrap{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between;padding-block:7px}
.concept b{font-weight:500}
.hdr{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hdr .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px;white-space:nowrap}
.brand svg{width:34px;height:29px;flex:none}
.brand em{font-style:normal;color:var(--brand)}
.vsep{width:1px;height:30px;background:var(--line)}
.inst{display:flex;align-items:center;gap:10px;min-width:0}
.inst-mark{width:42px;height:36px;border-radius:8px;background:var(--inst);color:var(--on-inst);display:grid;place-items:center;font:700 13px var(--f-display);flex:none}
.inst-name{display:flex;flex-direction:column;line-height:1.25}
.inst-name b{font-weight:600;font-size:14.5px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{min-height:40px;padding:0 14px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-size:14.5px}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.grow{flex:1 1 0}
.seg{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:10px}
.seg button{min-height:34px;padding:0 10px;border:none;border-radius:8px;background:transparent;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);font-weight:600;box-shadow:var(--shadow)}
.avatar{width:42px;height:42px;border-radius:50%;border:none;background:var(--deep);color:var(--surface);font:700 14px var(--f-display);flex:none}
.who{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
@media (max-width:860px){.who,.vsep,.hide-sm{display:none}}

main{padding-block:28px 56px}
.stack{display:flex;flex-direction:column;gap:24px}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.main-col{flex:999 1 560px;min-width:0}
.side-col{flex:1 1 320px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}
.panel h2{font-size:20px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}

.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:600;font-size:14.5px;text-decoration:none;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-outline{background:var(--surface);color:var(--brand);border-color:var(--brand)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line);font-weight:500}
.btn-dark{background:var(--ink);color:var(--bg);font-weight:500}
.btn-inst{background:var(--inst);color:var(--on-inst)}
.btn-sun{background:var(--sun);color:var(--on-sun)}
.btn[disabled]{background:var(--surface-2);color:var(--muted);border-color:var(--line);cursor:default}
.btn-sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn-block{width:100%}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:99px;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-brand{background:var(--brand-soft);color:var(--brand)}
.p-neutral{background:var(--surface-2);color:var(--muted)}
.p-inst{background:var(--inst-soft);color:var(--inst-ink)}
.p-sun{background:var(--sun);color:var(--on-sun);font-weight:600}

.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand)}

/* sign in */
.signin{display:flex;flex-wrap:wrap;min-height:calc(100vh - 120px)}
.si-brand{flex:1 1 460px;background:var(--inst);color:var(--on-inst);background-image:radial-gradient(rgba(255,255,255,.13) 1px,transparent 1px);background-size:22px 22px;display:flex}
.si-brand .in{padding:48px max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:24px;max-width:620px;margin-left:auto;width:100%}
.si-brand h1{font-size:clamp(30px,4vw,42px)}
.si-brand p{font-size:16.5px;opacity:.9;max-width:52ch}
.si-brand ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;opacity:.92}
.si-brand li::before{content:"●";color:var(--sun);margin-right:10px}
.si-form{flex:1 1 420px;display:flex;align-items:center;justify-content:center;padding:40px max(16px,env(safe-area-inset-right,0px)) 40px 16px}
.card-si{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* catalogue */
.cat-hero{background:var(--surface);border-bottom:1px solid var(--line);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px}
.cat-hero .wrap{padding-block:32px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end}
.cat-hero h1{font-size:clamp(28px,3.4vw,36px)}
.search{flex:1 1 320px;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:15px;min-width:0}
.cont-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:14px}
.cont{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.glyph{border-radius:14px;display:grid;place-items:center;color:#FFFFFF;font:700 26px var(--f-cjk);flex:none}
.filters{flex:1 1 220px;display:flex;flex-direction:column;gap:20px}
.filters h3{font:500 12px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.fbtn{min-height:40px;width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;margin-bottom:6px}
.fbtn[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:600}
.chk{display:flex;align-items:center;gap:10px;min-height:34px;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px}
.course{display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);transition:border-color .15s,transform .15s}
.course:hover{border-color:var(--brand)}
.course .open{all:unset;cursor:pointer;display:flex;flex-direction:column}
.course .open:focus-visible{outline:3px solid var(--brand);outline-offset:-3px}
.cover{position:relative;height:118px;display:grid;place-items:center;color:#FFFFFF;font:700 50px var(--f-cjk);background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1px);background-size:16px 16px}
.cover .lvl{position:absolute;left:12px;top:12px;background:#FFFFFF;color:#22282E;font:500 12px var(--f-body);padding:4px 10px;border-radius:99px}
.cover .asg{position:absolute;right:12px;top:12px;background:var(--sun);color:#22282E;font:600 12px var(--f-body);padding:4px 10px;border-radius:99px}
.course .body{padding:14px 16px 4px;display:flex;flex-direction:column;gap:5px}
.course h3{font-size:17px}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
.tag{padding:3px 8px;border-radius:6px;background:var(--surface-2);font-size:12px;color:var(--muted)}
.course .foot{margin-top:auto;padding:12px 16px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.empty{padding:40px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,28,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(460px,100%);height:100%;background:var(--surface);overflow-y:auto;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer .cover{height:150px;flex:none}
.drawer .x{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:42px;height:42px;border-radius:12px;border:none;background:#FFFFFF;color:#22282E;font-size:18px}
.drawer .in{padding:22px;display:flex;flex-direction:column;gap:16px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{padding:10px 12px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li::before{content:"✓";color:var(--brand);margin-right:8px;font-weight:700}

/* learner home */
.hero-learn{background:var(--brand);color:var(--on-brand);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:18px}
.hero-learn h1{font-size:clamp(26px,3vw,34px)}
.hero-learn .eyebrow{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.85}
.stages{display:flex;flex-wrap:wrap;gap:8px}
.stage{padding:7px 12px;border-radius:99px;font-size:13.5px;background:rgba(255,255,255,.95);color:#145876;font-weight:500}
.stage.now{background:var(--sun);color:#22282E;font-weight:600}
.stage.todo{background:transparent;border:1px solid rgba(255,255,255,.6);color:inherit}
.hero-learn .bar{background:rgba(0,0,0,.18)}
.hero-learn .bar>i{background:var(--sun)}
.hero-learn .btn-white{background:#FFFFFF;color:#0D719A}
.hero-learn .btn-line{border-color:rgba(255,255,255,.65);color:inherit;background:transparent;font-weight:500}
.plan{display:flex;flex-direction:column;gap:10px}
.plan-item{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.unit{display:flex;flex-direction:column;gap:7px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.unit.cur{border:2px solid var(--brand);background:var(--brand-soft)}
.unit.lock{border-style:dashed;color:var(--muted)}
.segs{display:flex;gap:5px}
.segs i{flex:1;height:6px;border-radius:4px;background:var(--line)}
.segs i.d{background:var(--brand)} .segs i.n{background:var(--sun)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:end;height:120px}
.week div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.week b{display:block;width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:var(--brand)}

/* tutor */
.tutor-top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;margin-bottom:18px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.convo{background:var(--surface);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;min-height:620px}
.scene{padding:14px 20px;background:var(--brand-soft);border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ai-badge{width:42px;height:42px;border-radius:12px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:700 15px var(--f-display);flex:none}
.msgs{flex:1;padding:20px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;max-height:560px}
.msg{display:flex;gap:10px;max-width:min(560px,88%)}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .who-b{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;background:var(--brand-soft);color:var(--brand)}
.msg.me .who-b{background:var(--deep);color:var(--surface)}
.bub{display:flex;flex-direction:column;gap:5px;padding:12px 15px;border-radius:4px 16px 16px 16px;background:var(--surface-2)}
.msg.me .bub{border-radius:16px 4px 16px 16px;background:var(--brand);color:var(--on-brand);align-items:flex-end}
.bub .t{font-family:var(--f-cjk);font-size:19px;line-height:1.45}
.bub .rom{font-size:13.5px;color:var(--muted)}
.bub .en{font-size:13.5px;color:var(--deep)}
.mcol{display:flex;flex-direction:column;gap:7px}
.msg.me .mcol{align-items:flex-end}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button{min-height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--muted)}
.wchips{display:flex;gap:5px;flex-wrap:wrap}
.wchip{padding:3px 8px;border-radius:6px;font-size:13px;font-family:var(--f-cjk);background:#FFFFFF}
.wchip.g{color:#1C6B43} .wchip.w{color:#7A5200} .wchip.b{color:#B03A0C}
.recast{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;border-radius:10px;background:var(--sun-soft);color:var(--sun-ink);font-size:13px;border:1px solid var(--line)}
.listening{align-self:flex-end;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;border:2px dashed var(--brand);background:var(--brand-soft);color:var(--deep)}
.wave{display:flex;gap:3px;align-items:center;height:24px}
.wave i{width:3px;border-radius:2px;background:var(--brand);animation:w 0.9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}.wave i:nth-child(6){animation-delay:.5s}
@keyframes w{0%,100%{height:6px}50%{height:22px}}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:t 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes t{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.wave i,.typing i{animation:none;height:14px}}
.composer{border-top:1px solid var(--line);padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.mic{width:76px;height:76px;border-radius:50%;border:6px solid var(--brand-soft);background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none;touch-action:none}
.mic.rec{background:#F15D22;color:#FFFFFF;border-color:var(--bad-soft)}
.mic svg{width:30px;height:30px}
.mic[disabled]{opacity:.5;cursor:default}
.text-in{flex:1 1 220px;display:flex;gap:8px}
.text-in input{flex:1;min-width:0;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-cjk),var(--f-body);font-size:16px}
.goal{display:flex;gap:10px;align-items:center;font-size:14px;padding-block:4px}
.goal .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none;color:transparent}
.goal.done .bx{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.goal.done span{color:var(--muted);text-decoration:line-through}
.phrase{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2);margin-bottom:8px}
.phrase .play{width:36px;height:36px;border-radius:10px;border:none;background:var(--brand-soft);color:var(--brand);flex:none}
.toggle{display:flex;justify-content:space-between;align-items:center;min-height:40px;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--brand)}
.complete{margin:4px auto;padding:18px;border-radius:16px;background:var(--good-soft);color:var(--good);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}

/* feedback */
.score-ring{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;flex:none}
.score-ring>div{width:112px;height:112px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring b{font:700 40px var(--f-display);color:var(--deep)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;flex:2 1 420px}
.metric{padding:14px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.metric b{font:700 26px var(--f-display)}
.line-w{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:14px;background:var(--surface-2);margin-bottom:10px}
.wbtn{min-height:44px;padding:4px 12px;border-radius:10px;font:500 19px var(--f-cjk);border:1px solid}
.wbtn small{font:12px var(--f-body);opacity:.85;margin-left:4px}
.wbtn.g{background:var(--good-soft);color:var(--good)} .wbtn.w{background:var(--warn-soft);color:var(--warn)} .wbtn.b{background:var(--bad-soft);color:var(--bad)}
.wbtn[aria-pressed="true"]{outline:3px solid var(--deep);outline-offset:1px}
.detail{display:flex;flex-wrap:wrap;gap:20px;padding:18px;border-radius:16px;background:var(--brand-soft);margin-top:6px}
.fix{padding:14px;border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.fix .k{font-size:12px;width:64px;flex:none}
.fix .r{display:flex;gap:8px;align-items:baseline}

/* teacher */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi b{font:700 28px var(--f-display)}
.tbl-wrap{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:4px;width:100%;min-width:640px;font-size:14px}
.heat th{font-weight:500;font-size:12px;color:var(--muted);text-align:center}
.heat th[scope="row"]{text-align:left;font-size:14px;color:var(--ink);white-space:nowrap;padding-right:8px}
.heat td{text-align:center;padding:8px 4px;border-radius:8px;font-variant-numeric:tabular-nums}
.h3c{background:var(--brand);color:var(--on-brand)} .h2c{background:var(--brand-soft);color:var(--deep)} .h1c{background:var(--bad-soft);color:var(--bad)} .h0c{background:var(--surface-2);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.err{padding:12px 14px;border-radius:12px;background:var(--surface-2);margin-bottom:10px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.book{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:9px}
.upload{border:2px dashed var(--brand);border-radius:16px;background:var(--brand-soft);color:var(--deep);min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.footer{border-top:1px solid var(--line);background:var(--surface)}
.footer .wrap{padding-block:16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;font-size:13px;color:var(--muted)}

const statusInfo = id => {

    enrolled:['Enrolled','p-good','Continue','btn-primary'],

    pending:['Request sent','p-warn','Pending','dis'],
    closed:[COURSES.find(c=>c.id===id).win,'p-neutral','Notify me','btn-outline'],
    notified:[COURSES.find(c=>c.id===id).win,'p-neutral','We’ll notify you','dis'],
    soon:['Coming soon','p-neutral','Notify me','btn-outline']
  })[s];
};
function ctaBtn(c, extra){
  const [, , label, cls]=statusInfo(c.id);
  if(cls==='dis') return `<button class="btn btn-sm ${extra||''}" disabled>${label}</button>`;
  return `<button class="btn btn-sm ${cls} ${extra||''}" data-cta="${c.id}">${label}</button>`;
}
function doCta(id){
  const s=S.status[id], c=COURSES.find(x=>x.id===id);
  if(s==='enrolled'){ if(id==='ko1') go('learn'); else toast('This demo has a full session for Korean for Beginners. Other courses are listed for illustration.'); return; }
  if(s==='open'){ S.status[id]='enrolled'; toast('You’re enrolled in '+c.title+'.'); return; }
  if(s==='approval'){ S.status[id]='pending'; toast('Request sent. Your lecturer usually replies within 2 working days.'); return; }
  if(s==='closed'||s==='soon'){ S.status[id]='notified'; toast('We’ll email you when enrolment opens.'); }
}

          ${PHRASES.map((p,i)=>`<div class="phrase"><button class="play" data-sayp="${i}" aria-label="Play ${esc(p[1])}">▶</button><div style="flex:1;min-width:0"><div class="cjk" lang="ko">${p[0]}</div><div class="xs muted">${p[1]}</div></div></div>`).join('')}</section>
        <section class="panel"><h2 style="margin-bottom:8px">Support</h2>
          <label class="toggle" for="t-rom">Romanization<input type="checkbox" id="t-rom" data-tg="roman" ${S.roman?'checked':''}></label>
          <label class="toggle" for="t-tr">Show translations<input type="checkbox" id="t-tr" data-tg="trans" ${S.trans?'checked':''}></label>
          <label class="toggle" for="t-hl">Hints in<select id="t-hl" style="min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 8px"><option>English</option><option>Tiếng Việt</option></select></label>
          <p class="xs muted" style="margin-top:6px">Corrections: gentle recasts during the talk, full notes after.</p></section>
      </aside>
    </div>
  </main>`);
}
function scrollMsgs(){const m=$('#msgs'); if(m) m.scrollTop=m.scrollHeight;}
function startSession(){S.step=0;S.log=[{who:'ai',m:SCRIPT[0].ai}];S.phase='idle';S.goals=[false,false,false];S.done=false;S.hintOn=false;S.scores=[];go('tutor');}
function studentTurn(typed){
  const cur=SCRIPT[S.step]; if(!cur||!cur.me) return;
  const m= typed!=null ? {t:typed} : cur.me;
  S.log.push({who:'me',m}); if(m.w) S.scores.push(...m.w);
  S.goals[cur.goal]=true; S.hintOn=false; S.phase='thinking'; render(); scrollMsgs();
  setTimeout(()=>{ S.step++; const nx=SCRIPT[S.step]; S.log.push({who:'ai',m:nx.ai}); S.phase='idle'; if(!SCRIPT[S.step].me){S.done=true;} render(); scrollMsgs(); if(S.autoSpeak) speak(nx.ai.t); },1100);
}

function vFeedback(){
  const all = S.scores.length?S.scores:[['아메리카노',92],['하나',63],['주세요',88],['아이스로',79],['주세요',90],['아니요',90],['얼마예요',68]];
  const avg=Math.round(all.reduce((a,b)=>a+b[1],0)/all.length);
  const overall=Math.round(avg*.5+76*.25+(S.done?100:67)*.25);
  const lines=[[['아메리카노',92],['하나',63],['주세요',88]],[['아이스로',79],['주세요',90]],[['아니요',90],['얼마예요',68]]];
  const sc=Object.fromEntries(all.map(([w,s])=>[w,s]));
  const sel=S.sel, tip=TIPS[sel]||{rom:'',tip:''};
  const A=[6,10,16,22,26,20,14,10,8,12,18,24,28,24,18,12,8,6,5,4,4,3,3,2], B=[5,9,14,20,24,18,12,8,6,8,10,12,13,11,9,6,5,4,4,3,3,2,2,2];
  const wave=(arr,c)=>`<div aria-hidden="true" style="display:flex;gap:3px;align-items:center;height:30px">${arr.map(h=>`<span style="width:4px;border-radius:2px;height:${h}px;background:${c}"></span>`).join('')}</div>`;
  return shell(`<main class="wrap stack">
    <div class="tutor-top" style="margin:0">
      <button class="iconbtn" data-go="learn" aria-label="Back to my learning">${ico('i-back')}</button>
      <div style="flex:1 1 260px"><span class="small muted">Session complete · Korean for Beginners · Unit 4</span><h1 style="font-size:22px">Role-play: Ordering drinks</h1></div>
      <button class="btn btn-outline" data-act="start">Try again</button><button class="btn btn-primary" data-go="learn">Done</button>
    </div>
    <section class="panel" style="display:flex;flex-wrap:wrap;gap:24px;align-items:center">
      <div class="score-ring" style="background:conic-gradient(var(--brand) 0 ${overall}%,var(--surface-2) ${overall}% 100%)"><div><b class="tab-nums">${overall}</b><span class="xs muted">overall</span></div></div>
      <div style="flex:1 1 260px;display:flex;flex-direction:column;gap:8px"><h2 style="font-size:26px">${S.done?'Mission complete. Nice ordering!':'Good start'}</h2>
        <p class="muted" style="max-width:52ch">You ordered and asked the price in Korean. Focus next on counters (<span class="cjk">잔</span>) and the vowel <span class="cjk">ㅓ</span>.</p></div>
      <div class="metrics">${[['Pronunciation',avg],['Fluency',76],['Grammar',72],['Mission',S.goals.filter(Boolean).length+'/3']].map(m=>`<div class="metric"><span class="small muted">${m[0]}</span><b class="tab-nums">${m[1]}</b><div class="bar"><i style="width:${typeof m[1]==='number'?m[1]:Math.round(S.goals.filter(Boolean).length/3*100)}%;${m[0]==='Grammar'?'background:#F15D22':''}"></i></div></div>`).join('')}</div>
    </section>
    <div class="row">
      <section class="panel main-col"><div class="ph"><h2 style="font-size:22px">Pronunciation</h2><span class="small muted">Select a word to compare your voice with the model</span></div>
        ${lines.map(l=>`<div class="line-w">${l.map(([w])=>{const s=sc[w]||90;return `<button class="wbtn ${s>=85?'g':s>=65?'w':'b'}" data-w="${w}" aria-pressed="${sel===w}" lang="ko">${w}<small>${s}</small></button>`}).join('')}</div>`).join('')}
        <div class="legend"><span><i style="background:var(--good-soft);border:1px solid var(--good)"></i>Good 85+</span><span><i style="background:var(--warn-soft);border:1px solid var(--warn)"></i>Close 65–84</span><span><i style="background:var(--bad-soft);border:1px solid var(--bad)"></i>Practise below 65</span></div>
        <div class="detail">
          <div style="flex:1 1 220px;display:flex;flex-direction:column;gap:8px"><span class="xs muted">Selected word</span><b class="cjk" style="font-size:34px;color:var(--deep)" lang="ko">${sel}</b><span class="small muted">${tip.rom} · score ${sc[sel]||'–'}</span><p class="small">${esc(tip.tip)}</p></div>
          <div style="flex:2 1 300px;display:flex;flex-direction:column;gap:12px">
            <div style="display:flex;gap:12px;align-items:center"><button class="btn btn-primary btn-sm" data-sayw="${sel}" aria-label="Play model audio">▶</button><div style="flex:1;min-width:0"><span class="xs muted">Model</span>${wave(A,'var(--brand)')}</div></div>
            <div style="display:flex;gap:12px;align-items:center"><button class="btn btn-outline btn-sm" data-act="youraudio" aria-label="Play your audio">▶</button><div style="flex:1;min-width:0"><span class="xs muted">You (sample)</span>${wave(B,'#F15D22')}</div></div>
            <button class="btn btn-sun btn-sm" style="align-self:flex-start" data-act="shadow">${ico('i-mic')}Shadow it again</button>
          </div>
        </div>
      </section>
      <aside class="side-col stack">
        <section class="panel"><h2 style="margin-bottom:12px">Grammar &amp; word choice</h2>
          ${FIXES.map(f=>`<div class="fix"><div class="r"><span class="k" style="color:var(--bad)">You said</span><span class="cjk muted" style="text-decoration:line-through" lang="ko">${f.said}</span></div><div class="r"><span class="k" style="color:var(--good)">Better</span><b class="cjk" lang="ko">${f.better}</b></div><span class="small muted">${f.why}</span></div>`).join('')}
        </section>
        <section class="panel"><div class="ph"><h2>Added to your review</h2><span class="small muted">4 cards</span></div>
          <div style="display:flex;flex-wrap:wrap;gap:8px">${[['잔','cup (counter)'],['따뜻한','warm / hot'],['아이스','iced'],['얼마예요','how much?']].map(w=>`<span class="pill p-brand" style="font-size:13.5px;padding:7px 12px"><b class="cjk" lang="ko">${w[0]}</b> · ${w[1]}</span>`).join('')}</div>
        </section>
      </aside>
    </div>
  </main>`);
}

function vTeacher(){
  const cls=v=>v==null?'h0c':v>=80?'h3c':v>=60?'h2c':'h1c';
  const ma=STUDENTS.find(s=>s[0]==='Nguyễn Minh Anh'); if(S.done){ma[1][3]=78;ma[2]='81 min';}
  return shell(`<main class="wrap stack">
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end">
      <div style="flex:1 1 300px"><h1 style="font-size:28px">Class overview</h1><span class="small muted">Korean for Beginners · Class KOR-101-02 · 24 students (sample)</span></div>
      <button class="btn btn-ghost" data-act="soon">Export report</button><button class="btn btn-primary" data-act="assign">+ New assignment</button>
    </div>
    <div class="kpis">${[['Active this week','21 / 24','3 inactive 7+ days',''],['Avg speaking time','58 min','per student, this week',''],['Unit 4 completion',S.done?'50%':'46%','target 80% by Fri','color:var(--brand)'],['Needs attention','3','low mastery or inactive','color:var(--bad)']]
      .map(k=>`<div class="kpi"><span class="small muted">${k[0]}</span><b class="tab-nums" style="${k[3]}">${k[1]}</b><span class="small">${k[2]}</span></div>`).join('')}</div>
    <div class="row">
      <section class="panel main-col"><div class="ph"><h2>Mastery by unit</h2><span class="small muted">8 of 24 students · sorted by need</span></div>
        <div class="tbl-wrap"><table class="heat"><thead><tr><th scope="col" style="text-align:left">Student</th>${[1,2,3,4,5,6].map(u=>`<th scope="col">U${u}</th>`).join('')}<th scope="col">Pron.</th><th scope="col" style="text-align:left">Speaking / wk</th></tr></thead>
        <tbody>${STUDENTS.map(s=>`<tr><th scope="row">${s[0]} ${s[3]?'<span class="pill p-bad" style="margin-left:4px">needs help</span>':''}${s[0]==='Nguyễn Minh Anh'&&S.done?'<span class="pill p-good" style="margin-left:4px">just practised</span>':''}</th>${s[1].map(v=>`<td class="${cls(v)}">${v==null?'–':v}</td>`).join('')}<td class="small muted" style="text-align:left">${s[2]}</td></tr>`).join('')}</tbody></table></div>
        <div class="legend"><span><i style="background:var(--brand)"></i>80+ mastered</span><span><i style="background:var(--brand-soft)"></i>60–79 developing</span><span><i style="background:var(--bad-soft)"></i>below 60 needs work</span><span><i style="background:var(--surface-2)"></i>not started</span></div>
      </section>
      <aside class="side-col stack">
        <section class="panel"><h2 style="margin-bottom:12px">Common errors this week</h2>
          ${[['하나 → 한 잔',14,'Counters with drinks (잔, 개)'],['(으)로 for choices',11,'Dropping 로 in “아이스로 주세요”'],['얼마예요 vs 있어요',7,'Using 있어요 to ask a price']].map(e=>`<div class="err"><div style="display:flex;justify-content:space-between;gap:8px"><b class="cjk">${e[0]}</b><span class="small" style="color:var(--bad);white-space:nowrap">${e[1]} students</span></div><span class="small muted">${e[2]}</span></div>`).join('')}
          <button class="btn btn-outline btn-block" data-act="mini">Create a mini-lesson from these</button></section>
        <section class="panel"><h2 style="margin-bottom:12px">Assignments</h2>
          ${[['Role-play: Ordering drinks','Due Fri',S.done?15:14],['Shadowing: Unit 4 dialogue','Due Mon',8]].map(a=>`<div style="margin-bottom:12px"><div class="small" style="display:flex;justify-content:space-between"><b style="font-weight:500">${a[0]}</b><span class="muted">${a[1]}</span></div><div class="bar" style="margin-block:6px"><i style="width:${Math.round(a[2]/24*100)}%"></i></div><span class="xs muted">${a[2]} of 24 completed</span></div>`).join('')}</section>
      </aside>
    </div>
    <section class="panel"><div class="ph"><h2>Coursebooks</h2><span class="small muted">Upload → AI extracts units, vocabulary, grammar and dialogues → you review → live for students</span></div>
      <div class="books">
        ${[['Korean 1 coursebook','Live','p-good','6 units · 214 words · 38 grammar points · 12 dialogues',4,'Edit content'],['Korean 2 coursebook','Needs review','p-warn','188 items extracted · 12 flagged for checking',2,'Review 12 flagged items']].map(b=>`<div class="book"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b style="font:700 16px var(--f-display)">${b[0]}</b><span class="pill ${b[2]}">${b[1]}</span></div><span class="small muted">${b[3]}</span><div class="segs">${[0,1,2,3].map(k=>`<i class="${k<b[4]?'d':k===b[4]?'n':''}"></i>`).join('')}</div><span class="xs muted">Uploaded · Extracted · Reviewed · Live</span><button class="btn btn-ghost btn-sm" style="align-self:flex-start" data-act="soon">${b[5]}</button></div>`).join('')}
        <button class="upload" data-act="upload">${ico('i-up')}<b>Upload a coursebook</b><span class="small">PDF or EPUB · audio optional</span></button>
      </div></section>
  </main>`);
}

/* ---------- Render + events ---------- */
function render(){
  const fx=document.activeElement&&document.activeElement.id; const pos=fx&&document.activeElement.selectionStart;
  const v = S.role==='teacher' && S.view!=='signin' ? vTeacher() : ({signin:vSignin,courses:vCourses,learn:vLearn,tutor:vTutor,feedback:vFeedback,teacher:vTeacher}[S.view]||vCourses)();
  $('#app').innerHTML=v;
  if(fx){const el=document.getElementById(fx); if(el){el.focus(); try{if(pos!=null)el.setSelectionRange(pos,pos);}catch(e){}}}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-act],[data-go]'); if(!t) return;
  if(t.matches('.scrim') && e.target!==t) return;
  const d=t.dataset;
  if(d.go){ if(S.role==='teacher') S.role='student'; go(d.go); return; }
  if(d.role){ S.role=d.role; S.drawer=null; if(d.role==='student'&&S.view==='teacher') S.view='courses'; render(); return; }
  if(d.ui){ S.uiLang=d.ui; if(d.ui==='vi') toast('Vietnamese interface is planned. This demo shows English.'); else render(); return; }
  if(d.si){ S.siState=d.si; render(); return; }
  if(d.lang){ S.lang=d.lang; render(); return; }
  if(d.tab){ S.tab=d.tab; render(); return; }
  if(d.open){ S.drawer=d.open; render(); setTimeout(()=>{const x=document.querySelector('.drawer .x'); x&&x.focus();},0); return; }
  if(d.cta){ doCta(d.cta); if(S.view==='courses') render(); return; }
  if(d.say!=null){ S.slow=false; speak(S.log[+d.say].m.t); return; }
  if(d.saysl!=null){ S.slow=true; speak(S.log[+d.saysl].m.t); S.slow=false; return; }
  if(d.sayp!=null){ speak(PHRASES[+d.sayp][0].replace('…','아메리카노 ')); return; }
  if(d.sayw){ speak(d.sayw); return; }
  if(d.w){ S.sel=d.w; render(); return; }
  switch(d.act){
    case 'login': S.siState='in'; go('courses'); break;
    case 'signout': S.role='student'; S.siState='in'; go('signin'); break;
    case 'reqaccess': toast('In the live product this sends a request to FTU’s PALS admin.'); break;
    case 'close': S.drawer=null; render(); break;
    case 'reset': S.lang='all'; S.tab='all'; S.q=''; S.lv={Beginner:true,Intermediate:true,Advanced:true}; render(); break;
    case 'start': startSession(); break;
    case 'mic':
      if(S.phase==='idle'){ S.phase='listening'; render(); scrollMsgs(); clearTimeout(S.micT); S.micT=setTimeout(()=>{ if(S.phase==='listening') studentTurn(); },2200); }
      else if(S.phase==='listening'){ clearTimeout(S.micT); studentTurn(); }
      break;
    case 'mode': S.mode=S.mode==='voice'?'text':'voice'; render(); if(S.mode==='text'){const i=$('#msgin'); i&&i.focus();} break;
    case 'trans': S.trans=!S.trans; render(); scrollMsgs(); break;
    case 'hint': S.hintOn=!S.hintOn; render(); scrollMsgs(); break;
    case 'end': if(!S.scores.length){ toast('Showing sample feedback, since this session had no spoken turns yet.'); } go('feedback'); break;
    case 'soonmode': toast('Guided and Free talk modes are in the full design. This demo runs the role-play.'); break;
    case 'youraudio': toast('In the live product this plays the student’s recording.'); break;
    case 'shadow': toast('In the live product the mic opens to record and re-score this word.'); break;
    case 'assign': toast('Assignment builder: pick a unit, scenario and due date (not in this demo).'); break;
    case 'mini': toast('A mini-lesson on these 3 errors would be drafted for your review.'); break;
    case 'upload': toast('Upload flow: the coursebook is processed, then shown for your review.'); break;
    case 'soon': toast('Not included in this demo.'); break;
  }
});
document.addEventListener('input',e=>{ if(e.target.id==='q'){ S.q=e.target.value; render(); } });
document.addEventListener('change',e=>{
  const d=e.target.dataset;
  if(d.lv){ S.lv[d.lv]=e.target.checked; render(); }
  if(d.tg){ S[d.tg]=e.target.checked; render(); scrollMsgs(); }
});
document.addEventListener('submit',e=>{ e.preventDefault(); const i=$('#msgin'); const v=i&&i.value.trim(); if(!v) return; studentTurn(v); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.drawer){S.drawer=null;render();} });

const h=(location.hash||'').slice(1); if(VIEWS.includes(h)){ if(h==='teacher'){S.role='teacher';S.view='courses';} else if(h==='tutor'){ startSession(); } else S.view=h; }
if(S.view!=='tutor') render();
})();
</script>
